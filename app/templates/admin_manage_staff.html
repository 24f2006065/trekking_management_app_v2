{% extends "admin_base.html" %} {% block page_template %}
<template id="admin-page-template">
  <div>
    <admin-navigation title="Manage Staff"></admin-navigation>
    <section class="card p-4 mb-4">
      <form @submit.prevent="loadStaff" class="d-flex gap-2">
        <input
          class="form-control"
          v-model="search"
          placeholder="Staff name or ID"
        />
        <button class="btn btn-primary">Search</button>
      </form>
    </section>
    <section class="card p-4">
      <details
        v-for="staffMember in staff"
        :key="staffMember.staff_id"
        class="border rounded p-3 mb-2"
      >
        <summary class="d-flex flex-wrap justify-content-between gap-2">
          <span
            ><strong>[[ staffMember.name ]]</strong> · [[ staffMember.status
            ]]</span
          >
          <span>Staff #[[ staffMember.staff_id ]]</span>
        </summary>
        <div class="pt-3">
          <p>User ID: [[ staffMember.user_id ]]</p>
          <p>
            Email: [[ staffMember.email ]] · Contact: [[
            staffMember.contact_details ]]
          </p>
          <form
            @submit.prevent="changeStatus(staffMember)"
            class="d-flex gap-2"
          >
            <select class="form-select" v-model="staffMember.status">
              <option>Active</option>
              <option>Inactive</option>
            </select>
            <button class="btn btn-secondary">Save</button>
          </form>
        </div>
      </details>
      <p v-if="staff.length === 0">No staff found.</p>
      <p v-if="message" class="alert alert-info mt-3" v-text="message"></p>
    </section>
  </div>
</template>
{% endblock %} {% block app_script %}
<script src="/static/admin_staff.js"></script>
{% endblock %}
