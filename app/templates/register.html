<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <main id="register-app" class="container py-5 auth-card" data-message="{{ message or '' }}">
        <section class="card p-4">
            <h1 class="h3 mb-3">Trekker Registration</h1>
            <div v-if="message" class="alert alert-info" v-text="message"></div>

            <form action="/register" method="post">
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input id="name" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input id="email" name="email" type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" name="password" type="password" class="form-control" minlength="6" required>
                </div>
                <button class="btn btn-primary" type="submit">Register</button>
            </form>

            <p class="mt-3 mb-0">Already registered? <a href="/login">Log in</a></p>
        </section>
    </main>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
