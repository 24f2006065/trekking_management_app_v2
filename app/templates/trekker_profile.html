{% extends "trekker_base.html" %} {% block page_template %}
<template id="trekker-page-template">
  <div>
    <trekker-navigation title="Edit Profile"></trekker-navigation>
    <section class="card p-4">
      <form @submit.prevent="saveProfile">
        <div class="mb-3">
          <label class="form-label">Name</label
          ><input class="form-control" v-model="profile.name" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label
          ><input
            class="form-control"
            type="email"
            v-model="profile.email"
            required
          />
        </div>
        <button class="btn btn-primary">Save Profile</button>
      </form>
      <p v-if="message" class="alert alert-info mt-3 mb-0" v-text="message"></p>
    </section>
  </div>
</template>
{% endblock %} {% block app_script %}
<script src="/static/trekker_profile.js"></script>
{% endblock %}
