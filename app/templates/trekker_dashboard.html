{% extends "trekker_base.html" %} {% block page_template %}
<template id="trekker-page-template">
  <div>
    <trekker-navigation title="Trekker Dashboard"></trekker-navigation>
    <section class="card p-4 mb-4">
      <p>Welcome, <span v-text="name"></span>.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card p-3">
            <strong>Available Open Treks</strong
            ><span v-text="availableTreks"></span>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card p-3">
            <strong>My Bookings</strong><span v-text="bookings.length"></span>
          </div>
        </div>
      </div>
    </section>
    <section class="card p-4">
      <h2 class="h5">Booked Treks and Status</h2>
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Trek</th>
              <th>Booking status</th>
              <th>Trek status</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="booking in bookings" :key="booking.booking_id">
              <td v-text="booking.trek_name"></td>
              <td v-text="booking.booking_status"></td>
              <td v-text="booking.trek_status"></td>
            </tr>
            <tr v-if="bookings.length === 0">
              <td colspan="3">You have no bookings yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</template>
{% endblock %} {% block app_script %}
<script src="/static/trekker_dashboard.js"></script>
{% endblock %}
