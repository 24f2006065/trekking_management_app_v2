{% extends "admin_base.html" %} {% block page_template %}
<template id="admin-page-template">
  <div>
    <admin-navigation title="Manage Treks"></admin-navigation>
    <section class="card p-4 mb-4">
      <form @submit.prevent="loadTreks" class="d-flex gap-2">
        <input
          class="form-control"
          v-model="search"
          placeholder="Trek name or ID"
        />
        <button class="btn btn-primary">Search</button>
      </form>
      <p v-if="message" class="alert alert-info mt-3 mb-0" v-text="message"></p>
    </section>
    <section class="card p-4">
      <div
        v-for="trek in treks"
        :key="trek.trek_id"
        class="border rounded p-3 mb-3"
      >
        <form @submit.prevent="updateTrek(trek)" class="row g-2">
          <div class="col-md-1">
            <label class="form-label">ID</label
            ><input class="form-control" :value="trek.trek_id" disabled />
          </div>
          <div class="col-md-3">
            <label class="form-label">Name</label
            ><input class="form-control" v-model="trek.trek_name" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">Location</label
            ><input class="form-control" v-model="trek.location" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">Difficulty</label
            ><select class="form-select" v-model="trek.difficulty">
              <option>Easy</option>
              <option>Moderate</option>
              <option>Hard</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Days</label
            ><input
              class="form-control"
              type="number"
              min="1"
              v-model="trek.duration_days"
              required
            />
          </div>
          <div class="col-md-2">
            <label class="form-label">Slots</label
            ><input
              class="form-control"
              type="number"
              min="0"
              v-model="trek.available_slots"
              required
            />
          </div>
          <div class="col-md-2">
            <label class="form-label">Status</label
            ><select class="form-select" v-model="trek.status">
              <option>Pending</option>
              <option>Approved</option>
              <option>Open</option>
              <option>Closed</option>
              <option>Started</option>
              <option>Ongoing</option>
              <option>Completed</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Start date</label
            ><input
              class="form-control"
              type="date"
              v-model="trek.start_date"
              required
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">End date</label
            ><input
              class="form-control"
              type="date"
              v-model="trek.end_date"
              required
            />
          </div>
          <div class="col-12">
            <button class="btn btn-primary">Save Trek</button>
          </div>
        </form>
        <form @submit.prevent="assignStaff(trek)" class="mt-2 d-flex gap-2">
          <select class="form-select" v-model="trek.staff_id">
            <option value="">Unassigned</option>
            <option
              v-for="staffMember in staff"
              :key="staffMember.staff_id"
              :value="staffMember.staff_id"
            >
              [[ staffMember.name ]]
            </option>
          </select>
          <button class="btn btn-secondary">Assign Staff</button>
        </form>
        <button class="btn btn-danger mt-2" @click="deleteTrek(trek.trek_id)">
          Remove Trek
        </button>
      </div>
      <p v-if="treks.length === 0">No treks found.</p>
    </section>
  </div>
</template>
{% endblock %} {% block app_script %}
<script src="/static/admin_treks.js"></script>
{% endblock %}
