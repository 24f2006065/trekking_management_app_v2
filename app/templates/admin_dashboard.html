<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - Trekking Management Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <main id="admin-app" class="container py-5 dashboard-card" data-user-name="{{ user_name }}">
        <section class="card p-4">
            <h1 class="h3">Admin Dashboard</h1>
            <p>Welcome, <span v-text="userName"></span>.</p>
            <a href="/logout" class="btn btn-secondary">Log out</a>
        </section>
    </main>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="{{ url_for('static', filename='admin_dashboard.js') }}"></script>
</body>
</html>
