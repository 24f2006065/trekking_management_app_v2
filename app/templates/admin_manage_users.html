{% extends "admin_base.html" %} {% block page_template %}
<template id="admin-page-template">
  <div>
    <admin-navigation title="Manage Trekkers"></admin-navigation>
    <section class="card p-4 mb-4">
      <form @submit.prevent="loadUsers" class="d-flex gap-2">
        <input
          class="form-control"
          v-model="search"
          placeholder="User name or ID"
        />
        <button class="btn btn-primary">Search</button>
      </form>
    </section>
    <section class="card p-4">
      <details
        v-for="user in users"
        :key="user.user_id"
        class="border rounded p-3 mb-2"
      >
        <summary class="d-flex flex-wrap justify-content-between gap-2">
          <span><strong>[[ user.name ]]</strong> · [[ user.status ]]</span>
          <span>User #[[ user.user_id ]]</span>
        </summary>
        <div class="pt-3">
          <p>Email: [[ user.email ]]</p>
          <form @submit.prevent="changeStatus(user)" class="d-flex gap-2">
            <select class="form-select" v-model="user.status">
              <option>Active</option>
              <option>Inactive</option>
            </select>
            <button class="btn btn-secondary">Save</button>
          </form>
        </div>
      </details>
      <p v-if="users.length === 0">No users found.</p>
      <p v-if="message" class="alert alert-info mt-3" v-text="message"></p>
    </section>
  </div>
</template>
{% endblock %} {% block app_script %}
<script src="/static/admin_users.js"></script>
{% endblock %}
